name: Build Jellyfin Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # allow pushing back to the repository using the provided token
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Update csproj version based on tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          sed -i -E "s/<Version>.*<\/Version>/<Version>${VERSION}<\/Version>/" Jellyfin.Plugin.CustomBranding/Jellyfin.Plugin.CustomBranding.csproj
          echo "Updated .csproj version to ${VERSION}"

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.CustomBranding/Jellyfin.Plugin.CustomBranding.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.CustomBranding/Jellyfin.Plugin.CustomBranding.csproj -c Release

      - name: Package plugin
        run: |
          set -euo pipefail
          
          # Séparer le dossier de préparation du dossier final d'artifacts
          mkdir -p build_output artifacts
          BIN_DIR="Jellyfin.Plugin.CustomBranding/bin/Release/net10.0"
          
          if [ -d "$BIN_DIR" ]; then
            cp -r "$BIN_DIR/"* build_output/
          else
            echo "Error: build output directory $BIN_DIR not found." >&2
            exit 1 # Ne pas utiliser '|| true' ici, il vaut mieux que l'action échoue si le build n'existe pas
          fi
          
          # Créer le zip proprement
          (cd build_output && zip -r -q ../artifacts/CustomBranding.zip .)
          
          # Générer le md5
          if [ -f artifacts/CustomBranding.zip ]; then
            md5sum artifacts/CustomBranding.zip | awk '{print $1}' > artifacts/CustomBranding.zip.md5
          else
            echo "Error: artifacts/CustomBranding.zip not found" >&2
            exit 1
          fi

      - name: Update manifest.json automatically
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # EXPORT est obligatoire ici pour que le script Python puisse lire les variables d'environnement
          export TAG=${GITHUB_REF#refs/tags/}
          export VERSION=${TAG#v}
          export MD5=$(cat artifacts/CustomBranding.zip.md5 2>/dev/null || echo "")
          export URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/CustomBranding.zip"
          export CHANGELOG=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || echo "Release automatique $VERSION")

          # Basculer proprement sur la branche main depuis un checkout de tag
          git fetch origin main
          git checkout main || git checkout -b main origin/main
          git pull origin main || true

          # Mettre à jour le manifest
          python3 - <<'PY'
          import os, json, datetime, sys
          manifest_path = "manifest.json"
          if not os.path.exists(manifest_path):
              print(f"manifest.json not found at {manifest_path}", file=sys.stderr)
              sys.exit(1)

          with open(manifest_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          # Récupération sécurisée des variables d'environnement
          version = os.environ.get("VERSION", "")
          md5 = os.environ.get("MD5", "")
          url = os.environ.get("URL", "")
          changelog = os.environ.get("CHANGELOG", f"Release automatique {version}")

          new_version = {
              "version": version,
              "changelog": changelog,
              "targetAbi": "12.0.0.0",
              "sourceUrl": url,
              "checksum": md5,
              "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          }

          if isinstance(data, list) and len(data) > 0 and "versions" in data[0]:
              data[0]["versions"].insert(0, new_version)
          else:
              if "versions" in data:
                  data["versions"].insert(0, new_version)
              else:
                  print("manifest.json format not recognized", file=sys.stderr)
                  sys.exit(1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
          PY

          # Commit et push sur main
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: auto-update manifest for ${TAG}"
            git push origin main
          else
            echo "No changes to manifest.json"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomBranding
          path: |
            artifacts/CustomBranding.zip
            artifacts/CustomBranding.zip.md5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CustomBranding.zip
            artifacts/CustomBranding.zip.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
