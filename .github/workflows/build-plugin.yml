name: Build Jellyfin Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.CustomBranding/Jellyfin.Plugin.CustomBranding.csproj -c Release

      - name: Package plugin
        run: |
          mkdir -p artifacts
          cp Jellyfin.Plugin.CustomBranding/bin/Release/net8.0/Jellyfin.Plugin.CustomBranding.dll artifacts/
          (cd artifacts && zip -r CustomBranding.zip .)
          md5sum artifacts/CustomBranding.zip | awk '{print $1}' > artifacts/CustomBranding.zip.md5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomBranding
          path: |
            artifacts/CustomBranding.zip
            artifacts/CustomBranding.zip.md5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CustomBranding.zip
            artifacts/CustomBranding.zip.md5
