name: Build Jellyfin Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # allow pushing back to the repository using the provided token
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.CustomBranding/Jellyfin.Plugin.CustomBranding.csproj

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.CustomBranding/Jellyfin.Plugin.CustomBranding.csproj -c Release

      - name: Package plugin
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # ensure the build output exists before copying
          BIN_DIR="Jellyfin.Plugin.CustomBranding/bin/Release/net10.0"
          if [ -d "$BIN_DIR" ]; then
            cp -r "$BIN_DIR/"* artifacts/ || true
          else
            echo "Warning: build output directory $BIN_DIR not found."
          fi
          # create zip (include everything in artifacts)
          (cd artifacts && zip -r -q CustomBranding.zip .)
          # write md5 hash (only hash value)
          if [ -f artifacts/CustomBranding.zip ]; then
            md5sum artifacts/CustomBranding.zip | awk '{print $1}' > artifacts/CustomBranding.zip.md5
          else
            echo "Error: artifacts/CustomBranding.zip not found" >&2
            exit 1
          fi

      - name: Update manifest.json automatically
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          # derive tag and version
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}

          # read md5 if present
          MD5=$(cat artifacts/CustomBranding.zip.md5 2>/dev/null || echo "")

          # URL where the release asset will be available
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/CustomBranding.zip"

          # ensure we have the latest main
          git fetch origin main:main
          git checkout main
          git pull --ff-only origin main || true

          # update manifest.json using Python and environment variables
          python3 - <<'PY'
import os, json, datetime, sys
manifest_path = "manifest.json"
if not os.path.exists(manifest_path):
    print(f"manifest.json not found at {manifest_path}", file=sys.stderr)
    sys.exit(1)

with open(manifest_path, "r", encoding="utf-8") as f:
    data = json.load(f)

# create new version entry
version = os.environ.get("VERSION", "")
tag = os.environ.get("TAG", "")
md5 = os.environ.get("MD5", "")
url = os.environ.get("URL", "")
new_version = {
    "version": version,
    "changelog": f"Release automatique {version}",
    "targetAbi": "12.0.0.0",
    "sourceUrl": url,
    "checksum": md5,
    "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
}

# assume manifest is a list and first element has 'versions'
if isinstance(data, list) and len(data) > 0 and "versions" in data[0]:
    data[0]["versions"].insert(0, new_version)
else:
    # fallback: try to append to top-level 'versions' key
    if "versions" in data:
        data["versions"].insert(0, new_version)
    else:
        print("manifest.json format not recognized; expected list with [0]['versions'] or top-level 'versions' key", file=sys.stderr)
        sys.exit(1)

with open(manifest_path, "w", encoding="utf-8") as f:
    json.dump(data, f, indent=4, ensure_ascii=False)
PY

          # commit only if changes exist
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: auto-update manifest for ${TAG}"
            git push origin main
          else
            echo "No changes to manifest.json"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomBranding
          path: |
            artifacts/CustomBranding.zip
            artifacts/CustomBranding.zip.md5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CustomBranding.zip
            artifacts/CustomBranding.zip.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
